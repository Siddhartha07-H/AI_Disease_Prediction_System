<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthAI - Patient Portal Sign In</title>
    <meta name="description" content="Sign in to your HealthAI patient account to manage health records and symptoms.">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 60%),
                        var(--bg-page);
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 38px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: white;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
            margin-bottom: 12px;
        }

        .auth-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .password-field-wrapper {
            position: relative;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .auth-status-msg {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            color: var(--primary);
            font-weight: 500;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .demo-credentials-box {
            margin-top: 18px;
            background: var(--bg-page);
            border: 1px dashed var(--border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <main class="auth-card">
        <div class="auth-header">
            <div class="auth-brand-icon">+</div>
            <h1>HealthAI Patient Portal</h1>
            <p>Sign in to access your predictions and clinical records</p>
        </div>

        <div style="display:flex;background:var(--bg-page);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px;border:1px solid var(--border);">
            <a href="login.html" style="flex:1;text-align:center;padding:8px 12px;font-size:13px;font-weight:700;color:var(--primary);text-decoration:none;border-radius:6px;background:var(--bg-surface);box-shadow:var(--shadow-sm);">👤 Patient Login</a>
            <a href="doctor-login.html" style="flex:1;text-align:center;padding:8px 12px;font-size:13px;font-weight:600;color:var(--text-muted);text-decoration:none;border-radius:6px;transition:all 0.2s ease;">⚕️ Doctor Portal</a>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field-wrapper">
                    <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="toggle-password-btn" id="toggle-password" title="Show/Hide Password" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-accent" style="width:100%;margin-top:10px;padding:12px;font-size:15px;" id="login-submit-btn">
                Sign In to Dashboard →
            </button>

            <button type="button" class="btn btn-outline" style="width:100%;margin-top:12px;padding:11px;font-size:14px;border-color:var(--primary);color:var(--primary);font-weight:600;" id="demo-login-btn" onclick="quickDemoLogin()">
                ⚡ One-Click Demo Patient Sign In
            </button>
        </form>

        <p id="login-message" class="auth-status-msg" role="status" aria-live="polite"></p>

        <!-- Demo account quick fill for convenient testing -->
        <div class="demo-credentials-box">
            <span>Demo: <strong>demo@healthai.com</strong> / <strong>Password123!</strong></span>
        </div>

        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html">Create an Account</a></p>
            <p style="margin-top:8px;"><a href="privacy.html">Clinical Data Privacy & Terms</a></p>
        </div>
    </main>

    <script src="script.js?v=200"></script>
    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById("toggle-password");
        const passwordInput = document.getElementById("password");
        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener("click", () => {
                const isPassword = passwordInput.type === "password";
                passwordInput.type = isPassword ? "text" : "password";
                toggleBtn.textContent = isPassword ? "🔒" : "👁️";
            });
        }

        // One-click demo sign in
        function quickDemoLogin() {
            document.getElementById("email").value = "demo@healthai.com";
            document.getElementById("password").value = "Password123!";
            document.getElementById("login-form").dispatchEvent(new Event("submit"));
        }
    </script>
</body>
</html>
