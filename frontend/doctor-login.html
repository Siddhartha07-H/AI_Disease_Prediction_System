<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthAI - Doctor & Specialist Portal Sign In</title>
    <meta name="description" content="Secure clinical portal sign in for verified medical doctors and healthcare specialists.">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(13, 148, 136, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.10) 0%, transparent 60%),
                        var(--bg-page);
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 38px 36px;
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .doctor-badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(13, 148, 136, 0.12);
            color: #0d9488;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 12px;
            border: 1px solid rgba(13, 148, 136, 0.25);
        }

        .auth-brand-icon-doc {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #0d9488, #2563eb);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            box-shadow: 0 6px 18px rgba(13, 148, 136, 0.35);
            margin-bottom: 10px;
        }

        .portal-switcher {
            display: flex;
            background: var(--bg-page);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .portal-switcher a {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .portal-switcher a.active {
            background: var(--bg-surface);
            color: #0d9488;
            box-shadow: var(--shadow-sm);
        }

        .password-field-wrapper {
            position: relative;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .auth-status-msg {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            color: #0d9488;
            font-weight: 500;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: #0d9488;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .demo-credentials-box {
            margin-top: 18px;
            background: rgba(13, 148, 136, 0.05);
            border: 1px dashed rgba(13, 148, 136, 0.35);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <main class="auth-card">
        <div style="text-align: center;">
            <div class="doctor-badge-tag">🩺 Medical Staff Only</div>
            <div>
                <div class="auth-brand-icon-doc">⚕️</div>
            </div>
            <h1 style="font-size:22px;font-weight:800;color:var(--text-primary);letter-spacing:-0.5px;margin-bottom:4px;">
                Doctor & Specialist Portal
            </h1>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">
                Sign in to manage patient appointments and review clinical records
            </p>
        </div>

        <div class="portal-switcher">
            <a href="login.html">👤 Patient Login</a>
            <a href="doctor-login.html" class="active">⚕️ Doctor Portal</a>
        </div>

        <form id="doctor-login-form">
            <div class="form-group">
                <label for="doctor-email">Medical Email Address</label>
                <input id="doctor-email" name="email" type="email" placeholder="doctor@hospital.org" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="doctor-password">Password</label>
                <div class="password-field-wrapper">
                    <input id="doctor-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="toggle-password-btn" id="toggle-password" title="Toggle visibility" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn" style="width:100%;margin-top:10px;padding:12px;font-size:15px;background:linear-gradient(135deg, #0d9488, #2563eb);color:white;border:none;border-radius:var(--radius-sm);font-weight:700;cursor:pointer;" id="doctor-submit-btn">
                Access Clinical Dashboard →
            </button>

            <button type="button" class="btn btn-outline" style="width:100%;margin-top:12px;padding:11px;font-size:14px;border-color:#0d9488;color:#0d9488;font-weight:600;" id="demo-doctor-btn" onclick="quickDemoDoctorLogin()">
                ⚡ One-Click Demo Doctor Sign In
            </button>
        </form>

        <p id="doctor-login-msg" class="auth-status-msg" role="status" aria-live="polite"></p>

        <div class="demo-credentials-box">
            <span>Demo: <strong>doctor@hospital.org</strong> / <strong>DoctorPass123!</strong></span>
        </div>

        <div class="auth-footer">
            <p>New medical practitioner? <a href="doctor-register.html">Register as a Doctor</a></p>
            <p style="margin-top:8px;"><a href="login.html">Switch to Patient Portal</a></p>
        </div>
    </main>

    <script src="script.js?v=200"></script>
    <script>
        // Password toggle
        const toggleBtn = document.getElementById("toggle-password");
        const passwordInput = document.getElementById("doctor-password");
        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener("click", () => {
                const isPassword = passwordInput.type === "password";
                passwordInput.type = isPassword ? "text" : "password";
                toggleBtn.textContent = isPassword ? "🔒" : "👁️";
            });
        }

        // Doctor Login submission
        const form = document.getElementById("doctor-login-form");
        const msg = document.getElementById("doctor-login-msg");
        const submitBtn = document.getElementById("doctor-submit-btn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            msg.style.color = "#0d9488";
            msg.textContent = "Authenticating clinical credentials...";
            submitBtn.disabled = true;

            const email = document.getElementById("doctor-email").value.trim();
            const password = document.getElementById("doctor-password").value;

            try {
                const res = await fetch(`${API_URL}/doctor/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Doctor login failed.");
                }

                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user_role", data.user.role);
                localStorage.setItem("user_name", data.user.full_name);
                if (data.doctor) {
                    localStorage.setItem("doctor_profile", JSON.stringify(data.doctor));
                }

                msg.style.color = "var(--success)";
                msg.textContent = "Access verified. Redirecting to Doctor Dashboard...";

                setTimeout(() => {
                    window.location.href = "doctor-dashboard.html";
                }, 600);

            } catch (err) {
                msg.style.color = "var(--danger)";
                msg.textContent = err.message || "Failed to sign in. Please verify credentials.";
                submitBtn.disabled = false;
            }
        });

        // Quick demo doctor login
        async function quickDemoDoctorLogin() {
            // First attempt to register the demo doctor if not yet created, then login
            const demoEmail = "doctor@hospital.org";
            const demoPass = "DoctorPass123!";

            try {
                await fetch(`${API_URL}/doctor/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        full_name: "Dr. Sarah Jenkins",
                        email: demoEmail,
                        password: demoPass,
                        specialty: "Cardiologist",
                        experience_years: 14,
                        clinic_address: "Heart & Vascular Institute, Suite 201",
                        contact_phone: "+1 (800) 555-0144",
                        license_number: "MED-CARD-99018"
                    })
                });
            } catch (_) {
                // Ignore conflict if already registered
            }

            document.getElementById("doctor-email").value = demoEmail;
            document.getElementById("doctor-password").value = demoPass;
            form.dispatchEvent(new Event("submit"));
        }
    </script>
</body>
</html>
